<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <title>Owner — Dott's website</title>
</head>
<body>
  <main class="owner-page ibm-plex-mono-medium">
    <header class="owner-header">
      <div>
        <h1 class="greeting ibm-plex-mono-bold">Owner</h1>
      </div>
      <a class="link" href="/">← Back home</a>
    </header>

    <fieldset>
      <legend>Owner browser</legend>
      <p>Mark this browser as Dott's so it is not included in the public visitor counter.</p>
      <form id="owner-setup-form" class="owner-form owner-form--compact">
        <label for="owner-token">Presence admin token</label>
        <input id="owner-token" name="token" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">Mark as owner</button>
      </form>
      <p id="owner-setup-result" class="owner-result" aria-live="polite"></p>
    </fieldset>

    <fieldset>
      <legend>Access</legend>
      <form id="cms-access-form" class="owner-form">
        <label for="cms-token">Token</label>
        <input id="cms-token" name="token" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
        <label class="owner-check"><input id="cms-remember" type="checkbox"> Remember on this device</label>
        <div class="owner-button-row">
          <button type="submit">Open</button>
          <button id="cms-forget" type="button" class="owner-button-secondary">Forget</button>
        </div>
      </form>
      <p id="cms-access-result" class="owner-result" aria-live="polite"></p>
    </fieldset>

    <section id="owner-private-root"></section>
  </main>

  <script src="/js/owner-setup.js" defer></script>
  <script src="/js/owner-loader.js" defer></script>
</body>
</html>
