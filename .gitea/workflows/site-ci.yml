name: Site CI

on:
  push:
    branches:
      - v2

concurrency:
  group: site-ci-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: shybit-forge
    timeout-minutes: 5
    steps:
      - name: Check out v2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
