  Shared site chrome.

  To add a new right sidebar, create another template here and use its
  data-layout value on the page's right sidebar container.
-->

    <li>█ <a href="/about">About me</a></li>
    <li>█ <a href="/days">Days</a></li>
    <li>█ <a href="//notes.somedott.space">Zametki(RUS ONLY)</a></li>

    <li style="display: flex">
      █
      <a
        href="https://somedott.atabook.org"
        class="wave-text"
        style="padding-left: 9px"
        ><span>G</span><span>u</span><span>e</span><span>s</span><span>t</span
        ><span>b</span><span>o</span><span>o</span><span>k</span></a
      >

    <li style="font-weight: bold; margin-top: 10px">─ My creations ─</li>
    <li>█ <a href="/projects">Projects</a></li>
    <li>█ <a href="/tracks">Tracks</a></li>

    <li>
      █
      <a
        href="/now/"
        id="random-page-link"
        data-random-routes="{{{random_routes}}}"
        >Random rabbit hole</a
      >
    </li>
    <br />
    <iframe
      width="180"
      height="180"
      style="border: none"
      src="https://dimden.dev/moon?custom=1&amp;textColor=%23ffffff&amp;linkColor=%23ffffff"
      name="dimdenmoonwidget"
      title="Moon phase"
      loading="lazy"
    ></iframe>

</template>

<template data-layout="right-home">
  <section class="presence-panel" aria-labelledby="presence-heading">
    <h2 id="presence-heading">STATUS</h2>
    <p
      id="presence-status"
      class="presence-status"
      data-status="loading"
      aria-live="polite"
    >
      <span class="presence-dot" aria-hidden="true"></span>
      <span id="presence-text">Checking...</span>
    </p>
  </section>
  <section class="now-panel" aria-labelledby="now-heading">
    <h2 id="now-heading">NOW</h2>
    {{{now_home}}}
  </section>
  <iframe
    width="180"
    height="180"
    style="border: none"
    src="https://dimden.neocities.org/navlink/"
    name="neolink"
    title="Neocities links"
    loading="lazy"
  ></iframe>
</template>
