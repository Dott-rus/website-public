<!DOCTYPE html>
<html lang="en">
<head>  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dott's 88×31 button and a small wall of buttons from around the personal web.">
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <script src="/js/components.js"></script>
  <title>88×31 buttons — somedott.space</title>
</head>
<body>
  <div class="container">
    <div id="sidebar-container" class="left-col ibm-plex-mono-light" data-layout="sidebar">
      <!-- Sidebar will be loaded here -->
    </div>
  
    <div class="cent-col">
      <div class="button-grid">
        <fieldset class="button-card ibm-plex-mono-medium">
          <legend>My button</legend>
          <img class="web-button" src="/Button.png" alt="Dott's website button" width="88" height="31" loading="lazy">
        </fieldset>

        <fieldset class="button-card ibm-plex-mono-medium">
          <legend>Tasory</legend>
          <a href="https://tasory.is-a.dev/">
            <img class="web-button" src="https://tasory.is-a.dev/src/img/mybutton.jpg" alt="Tasory's website button" width="88" height="31" loading="lazy">
          </a>
        </fieldset>

        <fieldset class="button-card ibm-plex-mono-medium">
          <legend>hws_</legend>
          <a href="https://meow.furrysobachka.ru/">
            <img class="web-button" src="https://cdn.grfruit.ru/img/button.png" alt="hws's website button" width="88" height="31" loading="lazy">
          </a>
        </fieldset>

        <fieldset class="button-card ibm-plex-mono-medium">
          <legend>puhnasty</legend>
          <a href="https://puhnasty61.github.io/">
            <span class="web-button web-button-fallback" title="Original button is unavailable">puhnasty</span>
          </a>
        </fieldset>

        <fieldset class="button-card ibm-plex-mono-medium">
          <legend>Sake Sao</legend>
          <a href="https://sakeyo.space/">
            <img class="web-button" src="https://sakeyo.space/images/SakeButton.png" alt="Sake Sao's website button" width="88" height="31" loading="lazy">
          </a>
        </fieldset>
      </div>

      <fieldset class="button-card ibm-plex-mono-medium">
        <legend>Other buttons and other shit that i kinda like</legend>
        <p>Sry i forgor where i found them...</p>
        <div class="button-wall">
          <img class="web-button" src="/img/buttons/bestondesktop.gif" alt="Best viewed on desktop" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/bobbutton.gif" alt="Bob website button" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/css.png" alt="CSS website button" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/emulate.gif" alt="Emulate website button" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/milk2.png" alt="Milk website button" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/minecraft.png" alt="Minecraft website button" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/n3ds.png" alt="Nintendo 3DS website button" width="88" height="31" loading="lazy">
          <img class="web-button" src="/img/buttons/www3.gif" alt="World Wide Web button" width="88" height="31" loading="lazy">
        </div>
      </fieldset>
    </div>
  
<div class="right-col ibm-plex-mono-light" data-layout="right-buttons">
  <!-- Right sidebar will be loaded here -->
</div>
  
</div>
<div id="footer-container" data-layout="footer">
  <!-- Footer will be loaded here -->
</div>
</body>
</html>
